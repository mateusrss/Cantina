<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantina da Igreja</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2b2b2b;--mut:#777;--ac:#2e7d5b;--bd:#e6e0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1c;--card:#272727;--tx:#eee;--mut:#aaa;--ac:#4caf87;--bd:#3a3a3a}}
:root[data-theme="dark"]{--bg:#1c1c1c;--card:#272727;--tx:#eee;--mut:#aaa;--ac:#4caf87;--bd:#3a3a3a}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.item b{display:block}.item span{color:var(--mut);font-size:14px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ac);background:none;color:var(--ac);font-size:20px;line-height:1}
.qty output{min-width:18px;text-align:center}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:16px}
input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-top:6px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:12px 0}
#send{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:700}
#send:disabled{opacity:.5}
</style>
</head>
<body>
<main>
<h1>🍰 Cantina da Igreja</h1>
<p class="sub">Escolha os itens e envie seu pedido pelo WhatsApp.</p>
<div id="list"></div>
<div class="box">
<label>Seu nome<input id="nome" placeholder="Ex.: Maria"></label>
<label style="display:block;margin-top:10px">Observações (opcional)<textarea id="obs" rows="2" placeholder="Ex.: sem cebola, retirar após o culto"></textarea></label>
<div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
<button id="send" disabled>Enviar pedido pelo WhatsApp</button>
</div>
</main>
<script>
// ====== EDITE AQUI ======
const WHATSAPP = "5527999655048"; // número da cantina: 55 + DDD + número
const ITEMS = [
  {nome:"Pastel de carne", preco:6},
  {nome:"Pastel de queijo", preco:6},
  {nome:"Coxinha", preco:5},
  {nome:"Bolo (fatia)", preco:4},
  {nome:"Cachorro-quente", preco:7},
  {nome:"Refrigerante lata", preco:5},
  {nome:"Suco", preco:4},
];
// ========================
const q = ITEMS.map(()=>0);
const R = v => "R$ " + v.toFixed(2).replace(".",",");
const list = document.getElementById("list");
ITEMS.forEach((it,i)=>{
  const d = document.createElement("div");
  d.className = "item";
  d.innerHTML = `<div><b>${it.nome}</b><span>${R(it.preco)}</span></div>
  <div class="qty"><button data-i="${i}" data-d="-1">−</button><output id="q${i}">0</output><button data-i="${i}" data-d="1">+</button></div>`;
  list.appendChild(d);
});
list.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  const i = +b.dataset.i;
  q[i] = Math.max(0, q[i] + +b.dataset.d);
  document.getElementById("q"+i).textContent = q[i];
  update();
});
const nome = document.getElementById("nome");
nome.addEventListener("input", update);
function total(){ return ITEMS.reduce((s,it,i)=>s+it.preco*q[i],0); }
function update(){
  document.getElementById("total").textContent = R(total());
  document.getElementById("send").disabled = !(total()>0 && nome.value.trim());
}
document.getElementById("send").addEventListener("click", ()=>{
  let m = `*Pedido da Cantina*\nNome: ${nome.value.trim()}\n\n`;
  ITEMS.forEach((it,i)=>{ if(q[i]) m += `${q[i]}x ${it.nome} - ${R(it.preco*q[i])}\n`; });
  m += `\n*Total: ${R(total())}*`;
  const o = document.getElementById("obs").value.trim();
  if(o) m += `\nObs: ${o}`;
  window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m), "_blank");
});
</script>
</body>
</html>
