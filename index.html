<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala Gurmet</title>
<style>
:root{--bg:#f2eee3;--card:#fffdf8;--tx:#3a322b;--mut:#8a7d70;--ac:#7a6a58;--bd:#e3dccd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif;padding-bottom:90px}
header{text-align:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px}
header img{width:150px;height:auto}
main{max-width:640px;margin:0 auto;padding:0 16px}
.st{border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;color:#fff;background:#4a8a5c}
.st.off{background:#b3372f}
.meta{color:var(--mut);font-size:13px;margin:10px 0}
#busca{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
h2{font-size:18px;margin:22px 0 8px}
.top{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.top .c{flex:0 0 140px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.top b{font-size:14px}.top span{font-size:13px;color:var(--mut)}
.it{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px}
.it.off{opacity:.5}
.it b{display:block}.it small{display:block;color:var(--mut);margin:2px 0 4px;font-size:13px}
.p{font-weight:700}
.tag{color:#b3372f;font-weight:700;font-size:13px}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ac);background:none;color:var(--ac);font-size:20px;line-height:1}
.qty button:disabled{opacity:.3}
.qty output{min-width:18px;text-align:center}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:20px}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin-top:6px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--ac);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;font-weight:700}
#bar button{background:#fff;color:var(--ac);border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px}
#send{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;margin-top:10px}
#send:disabled{opacity:.5}
#aviso{color:#b3372f;font-size:13px;margin-top:6px;min-height:16px}
</style></head><body>

<main>
<div id="st" class="st"></div>
<div class="meta" id="meta"></div>
<input id="busca" type="search" placeholder="Buscar item...">
<div id="topw"><h2>Os mais pedidos</h2><div class="top" id="top"></div></div>
<div id="menu"></div>
<div class="box" id="form">
<label>Seu nome<input id="nome" placeholder="Ex.: Maria"></label>
<label style="display:block;margin-top:10px">Observações (opcional)<textarea id="obs" rows="2" placeholder="Ex.: complementos do açaí, sabor do suco"></textarea></label>
<div id="aviso"></div>
<button id="send" disabled>Enviar pedido pelo WhatsApp</button>
</div>
</main>
<div id="bar"><span id="resumo">Nenhum item</span><button id="fin">Finalizar</button></div>
<script>
// ====== EDITE AQUI ======
const WHATSAPP="5527999655048";
const ABERTO=true;                 // false = loja fechada
const MSG_FECHADO="Loja fechada no momento";
const PEDIDO_MIN=0;                // valor mínimo do pedido (0 = sem mínimo)
// cat, nome, desc, preco | opcionais: estoque (máx. por pedido), esgotado:true, top:true
const ITEMS=[
{cat:"Açaí",nome:"Açaí",desc:"Com 4 complementos à sua escolha",preco:12,top:true},
{cat:"Salgados",nome:"Coxinha",desc:"",preco:5,top:true},
{cat:"Salgados",nome:"Pastel de presunto e queijo",desc:"",preco:6},
{cat:"Salgados",nome:"Pastel de carne",desc:"",preco:6},
{cat:"Salgados",nome:"Kibe",desc:"",preco:5},
{cat:"Lanches",nome:"Cachorro-quente",desc:"",preco:7,top:true},
{cat:"Bebidas",nome:"Suco",desc:"",preco:4},
{cat:"Bebidas",nome:"Água",desc:"",preco:3},
{cat:"Bebidas",nome:"Refrigerante lata",desc:"",preco:5,top:true},
{cat:"Bebidas",nome:"Refrigerante garrafinha",desc:"",preco:4},
];
// ========================
const $=id=>document.getElementById(id);
const R=v=>"R$ "+v.toFixed(2).replace(".",",");
const q=ITEMS.map(()=>0);
const max=it=>it.esgotado?0:(it.estoque??Infinity);
const total=()=>ITEMS.reduce((s,it,i)=>s+it.preco*q[i],0);
const count=()=>q.reduce((a,b)=>a+b,0);
$("st").textContent=ABERTO?"Pedidos abertos":MSG_FECHADO;
$("st").className="st"+(ABERTO?"":" off");
$("meta").textContent=PEDIDO_MIN?"Pedido mín. "+R(PEDIDO_MIN):"";
function ctrl(i,minus){const it=ITEMS[i];
 return `<div class="qty">${minus?`<button data-i="${i}" data-d="-1">−</button><output>${q[i]}</output>`:""}<button data-i="${i}" data-d="1" ${q[i]>=max(it)?"disabled":""}>+</button></div>`;}
function render(){
 const f=$("busca").value.trim().toLowerCase();
 const ok=it=>!f||(it.nome+" "+it.desc).toLowerCase().includes(f);
 const tops=ITEMS.map((it,i)=>[it,i]).filter(([it])=>it.top&&!it.esgotado&&ok(it));
 $("topw").style.display=tops.length?"":"none";
 $("top").innerHTML=tops.map(([it,i])=>`<div class="c"><b>${it.nome}</b><span>${R(it.preco)}</span>${ctrl(i,true)}</div>`).join("");
 const cats=[...new Set(ITEMS.map(i=>i.cat))];
 $("menu").innerHTML=cats.map(c=>{
  const rows=ITEMS.map((it,i)=>[it,i]).filter(([it])=>it.cat===c&&ok(it));
  if(!rows.length)return "";
  return `<h2>${c}</h2>`+rows.map(([it,i])=>`<div class="it${it.esgotado?" off":""}"><div><b>${it.nome}</b><small>${it.desc}</small>${it.esgotado?'<span class="tag">Esgotado</span>':`<span class="p">${R(it.preco)}</span>`}</div>${it.esgotado?"":ctrl(i,true)}</div>`).join("");
 }).join("");
 const n=count();
 $("resumo").textContent=n?`${n} ${n>1?"itens":"item"} · ${R(total())}`:"Nenhum item";
 const falta=PEDIDO_MIN&&total()<PEDIDO_MIN&&n;
 $("aviso").textContent=!ABERTO?MSG_FECHADO:(falta?`Pedido mínimo: ${R(PEDIDO_MIN)}`:"");
 $("send").disabled=!(ABERTO&&n&&total()>=PEDIDO_MIN&&$("nome").value.trim());
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button[data-i]");if(!b)return;
 const i=+b.dataset.i;q[i]=Math.min(max(ITEMS[i]),Math.max(0,q[i]+ +b.dataset.d));render();
});
$("busca").addEventListener("input",render);
$("nome").addEventListener("input",render);
$("fin").addEventListener("click",()=>$("form").scrollIntoView({behavior:"smooth"}));
$("send").addEventListener("click",()=>{
 let m=`*Pedido - Sala Gurmet*\nNome: ${$("nome").value.trim()}\n\n`;
 ITEMS.forEach((it,i)=>{if(q[i])m+=`${q[i]}x ${it.nome} - ${R(it.preco*q[i])}\n`;});
 m+=`\n*Total: ${R(total())}*`;
 const o=$("obs").value.trim();if(o)m+=`\nObs: ${o}`;
 window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m),"_blank");
});
render();
</script></body></html>
